[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=77",
  "wheel>=0.37.1",
]

[project]
name = "dtool_ibeis"
description = "dtool_ibeis - a dependency aware cache for ibeis"
license = "Apache-2.0"
license-files = [
  "LICENSE",
]
authors = [ { name = "Jon Crall", email = "erotemic@gmail.com" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
dynamic = [
  "dependencies",
  "optional-dependencies",
  "version",
]
urls.Homepage = "https://github.com/Erotemic/dtool_ibeis"

[tool.setuptools]
include-package-data = true
dynamic.dependencies.file = [
  "requirements/runtime.txt",
]
dynamic.optional-dependencies.all.file = [
  "requirements/optional.txt",
  "requirements/headless.txt",
  "requirements/graphics.txt",
]
dynamic.optional-dependencies.docs.file = [
  "requirements/docs.txt",
]
dynamic.optional-dependencies.graphics.file = [
  "requirements/graphics.txt",
]
dynamic.optional-dependencies.headless.file = [
  "requirements/headless.txt",
]
dynamic.optional-dependencies.optional.file = [
  "requirements/optional.txt",
]
dynamic.optional-dependencies.tests.file = [
  "requirements/tests.txt",
]
dynamic.readme.file = [
  "README.rst",
]
dynamic.readme.content-type = "text/x-rst"
dynamic.version.attr = "dtool_ibeis.__version__"
package-data."*" = [
  "requirements/*.txt",
]
packages.find.where = [
  ".",
]
packages.find.include = [
  "dtool_ibeis*",
]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest]
ini_options.addopts = "-p no:doctest --xdoctest --xdoctest-style=google --ignore-glob=setup.py --ignore-glob=dev --ignore-glob=docs"
ini_options.norecursedirs = ".git ignore build __pycache__ dev _skbuild docs"
ini_options.filterwarnings = [
  "default",
  "ignore:.*No cfgstr given in Cacher constructor or call.*:Warning",
  "ignore:.*Define the __nice__ method for.*:Warning",
  "ignore:.*private pytest class or function.*:Warning",
]

[tool.coverage]
run.branch = true
report.exclude_lines = [
  ".*  # nocover",
  ".*  # pragma: no cover",
  ".*if six.PY2:",
  "^ *pass *$",
  "^ *raise",
  "def __repr__",
  "if __name__ == .__main__.:",
  "if _debug:",
  "if 0:",
  "if trace is not None",
  "pragma: no cover",
  "raise AssertionError",
  "raise NotImplementedError",
  "verbose = .*",
]
report.omit = [
  "*/setup.py",
  "dtool_ibeis/__main__.py",
]

[tool.xcookie]
tags = [
  "erotemic",
  "purepy",
  "github",
  "cv2",
  "notypes",
]
mod_name = "dtool_ibeis"
repo_name = "dtool_ibeis"
rel_mod_parent_dpath = "."
os = [
  "linux",
  "osx",
  "win",
]
ci_pypy_versions = []
description = "dtool_ibeis - a dependency aware cache for ibeis"
url = "https://github.com/Erotemic/dtool_ibeis"
author = "Jon Crall"
min_python = "3.10"
author_email = "erotemic@gmail.com"
dev_status = "beta"
license = "Apache 2"
autostage = true
version = "{mod_dpath}/__init__.py::__version__"
use_setup_py = false
use_pyproject_requirements = false
ci_pypi_trusted_publishing = true
enable_gpg = true
